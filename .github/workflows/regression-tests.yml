name: Training-free regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests (ML and accelerator checks skip explicitly)
        run: python -B -m unittest discover -s tests -v
      - name: Verify smoke results preserve the full-run sentinel
        run: python -B scripts/reproduce_smoke_output_collision.py --repo .
      - name: Check smoke-script syntax
        run: bash -n scripts/smoke_test.sh
